name: hourly-collect
on:
  schedule:
    - cron: '59 1 1 * *'
  workflow_dispatch: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Call collector
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://blast-buddies-portal.vercel.app/api/collect
