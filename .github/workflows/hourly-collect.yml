name: hourly-collect
on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://blast-buddies-portal.vercel.app/api/collect
