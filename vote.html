<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Vote | Blast Buddies Tracker</title>
<link rel="icon" href="images/icons/home.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ---- community vote: results ---- */
.vt-bar-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:1400px;margin:0 auto 16px}
.vt-bar-top .seg{margin:0}
.vt-bar-top .grow{flex:1}
.vt-view .vt-item{cursor:default;position:relative;width:104px;padding-bottom:6px}
.vt-view .vt-item:hover{transform:none;background:var(--card);border-color:var(--line)}
.vt-view .vt-item small{color:var(--muted);font-weight:600;font-size:11px}
.vt-me{position:absolute;top:4px;right:4px;font-size:10px;font-weight:800;color:#10150c;background:var(--gold);border-radius:999px;padding:1px 6px}
.vt-empty{color:var(--muted);font-size:13px;padding:10px}
/* call to action for people who have not voted yet */
.vt-cta{background:var(--gold);color:#10150c;font-weight:800;position:relative;animation:vtPulse 2s infinite}
.vt-bang{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:8px;border-radius:50%;background:#10150c;color:var(--gold);font-size:13px;font-weight:800}
@keyframes vtPulse{0%{box-shadow:0 0 0 0 rgba(242,183,53,.6)}70%{box-shadow:0 0 0 12px rgba(242,183,53,0)}100%{box-shadow:0 0 0 0 rgba(242,183,53,0)}}
@media(prefers-reduced-motion:reduce){.vt-cta{animation:none}}
.vt-banner{max-width:1400px;margin:0 auto 14px;padding:12px 16px;border:1px solid #6a5a1f;background:rgba(242,183,53,.08);border-radius:14px;font-size:14px}
.vt-rank{max-width:1400px;margin:0 auto;background:rgba(15,20,11,.94);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.vt-rk{display:grid;grid-template-columns:44px 56px minmax(120px,1fr) minmax(120px,2fr) 70px 90px;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.vt-rk:last-child{border-bottom:0}
.vt-rk .n{color:var(--muted);font-weight:800;text-align:center}
.vt-rk img{width:48px;height:48px;object-fit:contain;background:var(--card2);border-radius:8px}
.vt-rk .nm{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vt-rk .sc b{font-size:15px}
.vt-rk .sc small{color:var(--muted);margin-left:4px}
.vt-rk .tr{height:8px;border-radius:5px;background:#050704;overflow:hidden}
.vt-rk .tr i{display:block;height:100%;border-radius:5px}
.vt-rk .pc{text-align:right;color:var(--muted);font-size:13px}
.vt-pill{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;padding:0 8px;border-radius:7px;font-weight:800;font-size:13px;color:#10150c;background:#3a4630}
.t-S.vt-pill,.vt-fill.t-S{background:#ff7b7b}.t-A.vt-pill,.vt-fill.t-A{background:#ffb35c}.t-B.vt-pill,.vt-fill.t-B{background:#ffe066}
.t-C.vt-pill,.vt-fill.t-C{background:#a3e36f}.t-D.vt-pill,.vt-fill.t-D{background:#6fc8ff}
@media(max-width:700px){.vt-rk{grid-template-columns:32px 44px 1fr 60px}.vt-rk .tr,.vt-rk .pc{display:none}}
</style>
</head>
<body data-page="vote">
<template id="page-content">
<section class="panel">
  <h1 class="page-title">Community Vote</h1>
  <p class="muted" id="vtIntro">Loading...</p>
</section>
<div id="vtApp"></div>
</template>
<script src="js/layout.js"></script>
<script>
(() => {
  const API = '/api/hourly?mode=vote';
  const LABEL = { maps: 'Maps', primary: 'Primary', secondary: 'Secondary', grenades: 'Grenades', abilities: 'Abilities' };
  const CATS = Object.keys(LABEL);
  const IMG = { maps: 'images/maps', primary: 'images/weapons', secondary: 'images/weapons', grenades: 'images/weapons', abilities: 'images/abilities' };
  const FB = `this.onerror=null;this.src='images/placeholder.png'`;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const emptyPicks = () => Object.fromEntries(CATS.map(c => [c, {}]));
  const app = document.getElementById('vtApp'), intro = document.getElementById('vtIntro');
  let ITEMS, TIERS, cat = 'maps', sel = null, busy = false, editing = false, saved = null;   // saved = latest results payload
  let mode = 'form', view = 'tiers';                                                         // mode: form | results, view: tiers | ranking
  let picks = emptyPicks();
  // categories the server actually sent (so the page keeps working if one is missing)
  const cats = () => CATS.filter(c => (ITEMS && ITEMS[c]) || (saved && saved.results && saved.results[c]));
  const catTabs = () => cats().map(c => `<button data-cat="${c}" class="${c === cat ? 'on' : ''}">${LABEL[c]}</button>`).join('');

  const tile = (c, n) => `<button class="weapon-tile vt-item${sel === n ? ' sel' : ''}" draggable="true" data-item="${esc(n)}">
      <img src="${IMG[c]}/${esc(n)}.png" alt="" onerror="${FB}"><span>${esc(n)}</span></button>`;

  function form() {
    mode = 'form';
    if (!cats().includes(cat)) cat = cats()[0];
    const placed = Object.keys(picks[cat]).length, total = ITEMS[cat].length, canGoBack = !!(saved && saved.results);
    intro.textContent = editing
      ? 'Editing your tier list. Saving replaces your previous picks, and your vote still counts once.'
      : 'Sort each category into tiers, then submit. Your vote counts once and you can change your tier list later.';
    app.innerHTML = `
      <div class="toolbar"><div class="seg">${catTabs()}</div>
        <span class="muted" style="align-self:center">${placed}/${total} placed in ${LABEL[cat]}. Tap an item, then tap a tier (or drag it).</span></div>
      <section class="panel vt-board">
        ${[...TIERS, null].map(t => `<div class="vt-row${t ? ' t-' + t : ''}" data-tier="${t || ''}">
          <b class="vt-label">${t || 'Unsorted'}</b>
          <div class="vt-zone">${ITEMS[cat].filter(n => (picks[cat][n] || null) === t).map(n => tile(cat, n)).join('')}</div></div>`).join('')}
      </section>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="pill" id="vtSubmit">${editing ? 'Save changes' : 'Submit my tier list'}</button>
        ${canGoBack ? `<button class="pill" id="vtCancel">${editing ? 'Cancel' : 'Back to results'}</button>` : ''}
      </div>`;
  }

  function place(item, tier) {
    if (!item || !ITEMS[cat].includes(item)) return;
    if (tier) picks[cat][item] = tier; else delete picks[cat][item];
    sel = null; form();
  }

  // opens the tier list editor: empty for new voters, filled with their picks for people who already voted
  function startEdit() {
    ITEMS = saved.items || ITEMS; TIERS = saved.tiers || TIERS;
    picks = emptyPicks();
    for (const c of CATS) Object.assign(picks[c], saved.mine?.[c] || {});
    cat = cats()[0]; sel = null; editing = !!saved.voted; form();
  }

  app.addEventListener('click', e => {
    if (e.target.closest('#vtEdit')) return startEdit();
    if (e.target.closest('#vtCancel')) return results(saved);
    const v = e.target.closest('[data-view]'); if (v) { view = v.dataset.view; return results(saved); }
    const c = e.target.closest('[data-cat]'); if (c) { cat = c.dataset.cat; sel = null; return mode === 'results' ? results(saved) : form(); }
    if (mode === 'results') return;
    const t = e.target.closest('.vt-item'); if (t) { sel = sel === t.dataset.item ? null : t.dataset.item; return form(); }
    const r = e.target.closest('.vt-row'); if (r && sel) return place(sel, r.dataset.tier);
    if (e.target.closest('#vtSubmit')) submit();
  });
  app.addEventListener('dragstart', e => { const t = e.target.closest('.vt-item'); if (t && mode === 'form') e.dataTransfer.setData('text/plain', t.dataset.item); });
  app.addEventListener('dragover', e => { if (mode === 'form' && e.target.closest('.vt-row')) e.preventDefault(); });
  app.addEventListener('drop', e => { const r = e.target.closest('.vt-row'); if (mode === 'form' && r) { e.preventDefault(); place(e.dataTransfer.getData('text/plain'), r.dataset.tier); } });

  async function submit() {
    if (busy) return;
    const n = CATS.reduce((s, c) => s + Object.keys(picks[c]).length, 0);
    if (n < 3) return alert('Place at least 3 items before submitting.');
    if (!editing && !confirm('Submit your tier list? You can change it later.')) return;
    busy = true;
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tiers: picks }) });
      const d = await r.json();
      if (d.voted) results(d); else alert(d.error || 'Something went wrong.');
    } catch (x) { alert('Could not reach the server. Please try again.'); }
    busy = false;
  }

  // ---------- results: the community tier list (items placed by average score) or a ranking ----------
  function results(d) {
    saved = d; editing = false; mode = 'results'; TIERS = d.tiers || TIERS; ITEMS = d.items || ITEMS;
    if (!cats().includes(cat)) cat = cats()[0];
    const mine = d.mine?.[cat] || {};
    // average score runs from top tier (best) down to the last tier; turn it back into a tier letter
    const tierOf = avg => TIERS[Math.min(TIERS.length - 1, Math.max(0, Math.round(TIERS.length - avg)))];
    const list = (d.results[cat] || []).map(r => ({ ...r, tier: r.avgScore > 0 ? tierOf(r.avgScore) : null })).sort((a, b) => (b.avgScore || 0) - (a.avgScore || 0));
    const ballots = `${d.total} ballot${d.total === 1 ? '' : 's'} so far. Items are placed by their average score across all voters.`;
    intro.textContent = d.voted ? `${d.edited ? 'Your tier list was updated.' : 'Thanks for voting!'} ${ballots}` : ballots;
    const me = r => mine[r.item] ? `<span class="vt-me" title="Your pick">You: ${esc(mine[r.item])}</span>` : '';
    const img = r => `<img src="${IMG[cat]}/${esc(r.item)}.png" alt="" onerror="${FB}">`;

    const tiersView = `<section class="panel vt-board vt-view">
      ${[...TIERS, null].map(t => {
        const rows = list.filter(r => r.tier === t);
        if (!t && !rows.length) return '';
        return `<div class="vt-row${t ? ' t-' + t : ''}"><b class="vt-label">${t || 'No votes'}</b>
          <div class="vt-zone">${rows.map(r => `<div class="weapon-tile vt-item" title="${esc(r.item)}: avg ${r.avgScore}/5, ${r.pctTop}% rated it S or A">
            ${me(r)}${img(r)}<span>${esc(r.item)}</span><small>${r.pctTop}% S/A</small></div>`).join('') || '<span class="vt-empty">Nothing here</span>'}</div></div>`;
      }).join('')}</section>`;

    const rankView = `<section class="vt-rank">${list.map((r, i) => `<div class="vt-rk">
        <span class="n">${i + 1}</span>${img(r)}
        <span class="nm">${esc(r.item)}${r.tier ? `<span class="vt-pill t-${r.tier}">${r.tier}</span>` : ''}${mine[r.item] ? `<span class="vt-me" style="position:static">You: ${esc(mine[r.item])}</span>` : ''}</span>
        <div class="tr"><i class="vt-fill${r.tier ? ' t-' + r.tier : ''}" style="width:${Math.min(100, (r.avgScore || 0) / TIERS.length * 100)}%"></i></div>
        <span class="sc"><b>${r.avgScore}</b><small>/${TIERS.length}</small></span>
        <span class="pc">${r.pctTop}% S/A</span></div>`).join('') || '<p class="muted" style="padding:20px">No votes yet.</p>'}</section>`;

    const action = d.voted
      ? '<button class="pill" id="vtEdit">Edit my tier list</button>'
      : '<button class="pill vt-cta" id="vtEdit" title="You have not voted yet">Cast your vote<span class="vt-bang">!</span></button>';
    app.innerHTML = (d.voted ? '' : '<div class="vt-banner"><b>You have not voted yet.</b> Have a look at the results, then add your own tier list. It only takes a minute and counts once.</div>')
      + `<div class="vt-bar-top">
        <div class="seg">${catTabs()}</div>
        <div class="seg"><button data-view="tiers" class="${view === 'tiers' ? 'on' : ''}">Tier list</button><button data-view="ranking" class="${view === 'ranking' ? 'on' : ''}">Ranking</button></div>
        <span class="grow"></span>${action}</div>`
      + (view === 'tiers' ? tiersView : rankView);
  }

  (async () => {
    try {
      const d = await (await fetch(API)).json();
      if (d.results) return results(d);                  // results come first, voted or not
      ({ items: ITEMS, tiers: TIERS } = d); form();      // older server response without results: go straight to voting
    } catch (x) { intro.textContent = 'Could not load the vote. Please try again later.'; }
  })();
})();
</script>
</body>
</html>
