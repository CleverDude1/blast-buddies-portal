<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podium | Blast Buddies Tracker</title>
<link rel="icon" href="images/icons/home.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="podium">
<template id="page-content">
<section class="panel">
  <h1 class="page-title">Podium</h1>
  <p class="muted">Who has won the most medals. Medals go to the top 3 of each day, the top 10 of each week, and the top 3 of each ranked season and clan ranking. XP, weapon and clan are the latest known.</p>
  <div class="seg" id="filters" style="margin-top:16px">
    <button data-f="overall" class="on">Overall</button><button data-f="day">Day</button><button data-f="week">Week</button>
    <button data-f="ranked">Ranked</button><button data-f="clan">Clan</button><button data-f="monthly">Monthly</button>
  </div>
  <div class="pd-sub" id="sub"></div>
</section>
<div class="toolbar">
  <input class="search" id="q" type="search" placeholder="Search for a player or clan" aria-label="Search">
</div>
<p class="status" id="status">Loading...</p>
<div class="board"><div class="board-inner">
  <div class="lb-row pd-row lb-head" id="head"></div>
  <div id="rows"></div>
</div></div>
<dialog id="dlg"><button class="pill dlg-close" id="dlgClose">Close</button><div id="dlgBody"></div></dialog>
</template>
<script src="js/layout.js"></script>
<script src="js/level.js"></script>
<script src="js/clan-colors.js"></script>
<script src="js/podium.js"></script>
</body>
</html>
