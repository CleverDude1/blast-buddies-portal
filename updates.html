<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Updates | Blast Buddies Tracker</title>
<link rel="icon" href="images/icons/home.png">
<link rel="stylesheet" href="css/style.css">
<style>
/* ---- updates / release notes ---- */
.up-wrap{max-width:1100px;margin:0 auto}
.up-head{text-align:center;margin-bottom:8px}
.up-head h1{font-size:clamp(28px,4vw,44px);font-weight:800}
.up-intro{text-align:center;color:#d9dccf;font-style:italic;max-width:760px;margin:12px auto 22px;line-height:1.6}
.up-intro a{color:#8fa4ff;font-weight:600}
.up-tabs{display:flex;justify-content:center;margin-bottom:22px}
.up-tabs .seg{margin:0}
.up-card{background:rgba(15,20,11,.94);border:1px solid var(--line);border-radius:18px;padding:24px 28px;margin-bottom:20px}
.up-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.up-badge{font-size:12px;font-weight:800;letter-spacing:.04em;padding:4px 10px;border-radius:8px;color:#06201c;background:#3cc1b5}
.up-badge.minor{background:var(--gold);color:#3a2200}
.up-badge.soon{background:#5aa9ff;color:#06182e}
.up-badge.patch{background:#8b9380;color:#10150c}
.up-ver{font-size:22px;font-weight:800;color:#4fd8c8}
.up-date{margin-left:auto;color:var(--muted);font-weight:600}
.up-list{list-style:none;display:grid;gap:10px}
.up-list li{display:flex;gap:12px;align-items:flex-start;line-height:1.5;color:#e8eadf}
.up-list li::before{content:"";flex:none;width:16px;height:16px;margin-top:4px;border-radius:50%;border:2px solid #4fd8c8;background:radial-gradient(circle,#4fd8c8 0 3px,transparent 4px)}
.up-ic{flex:none}
.up-empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body data-page="updates">
<template id="page-content">
  <div class="up-wrap">
    <div class="up-head"><h1>Updates</h1></div>
    <p class="up-intro">This is a community-driven project and we are always looking for ways to improve it. If you have any suggestions or ideas, please share them on our <a id="upDiscord" href="#" target="_blank" rel="noopener">Discord</a>. Thanks!</p>
    <div class="up-tabs"><div class="seg">
      <button data-tab="tracker">Tracker updates</button>
      <button data-tab="game">Game updates</button>
    </div></div>
    <div id="upList"></div>
  </div>
</template>

<script src="js/layout.js"></script>
<script>
// ================= EDIT YOUR UPDATES HERE =================
// Newest first. type: 'major' | 'minor' | 'patch'. date is optional (YYYY-MM-DD). upcoming: true shows a COMING SOON badge and "Date TBA".  Item kinds: new, tool, fix, balance, server, map, weapon, info
const KIND = { new: '✨', tool: '🛠️', fix: '🐛', balance: '⚖️', server: '📦', map: '🗺️', weapon: '🔫', info: 'ℹ️' };

const UPDATES = {
  tracker: [
    { version: '1.0', type: 'major', items: [
      ['info',   '[Tracker] First release of Blast Buddies Tracker'],
      ['new',    '[Rankings] Daily, Weekly, Ranked and Clan leaderboards. Players show level, position, kills, deaths, KDR, top weapon and clan, with more information such as total XP'],
      ['new',    '[Ranked] Ranked leaderboard shows trophies, wins and losses'],
      ['new',    '[Clan Rankings] Clans show kills, whether they are open or closed to new members, member count and how full the clan is'],
      ['tool',   '[Podium] Tabs for Overall, Day, Week, Ranked, Clan and Monthly. Medals are earned by finishing top 3 on the daily, ranked and clan boards and top 10 on the weekly board. Shows each player\'s medals, XP, level, top weapon and clan'],
      ['tool',   '[Podium] Monthly tab: the clan with the most medals from its members is the winner of the month. Browse past months and see everyone\'s medals for that month'],
      ['tool',   '[Compare] Compare two players or two clans. Shows who is leading, current or last leaderboard positions, and the differences in numbers and percentages'],
      ['tool',   '[Compare] Players: kills, deaths and KDR for daily, weekly and ranked, plus trophies, wins and losses for ranked'],
      ['tool',   '[Compare] Average score graphs across daily, weekly and ranked'],
      ['tool',   '[Compare] Live graphs for kills, deaths, KDR, wins, losses and trophies, with final scores for both sides. Daily: today or yesterday. Weekly: current or previous week. Ranked: last 7 days, last 30 days or the whole season'],
      ['tool',   '[Compare] Clans: kills, open or closed, number of members and capacity filled in percent, average and max kills, average and max members, and graphs of kills and members over the last 7, 30 and 365 days'],
      ['new',    '[Player Updates] Name changes, top weapon changes, players reaching level 100, and players joining or leaving clans. Data is collected hourly, so times are estimates'],
      ['new',    '[Clan Updates] Members leaving, renames, access changes and color changes. Data is collected hourly, so times are estimates'],
      ['new',    '[Statistics] How many players have reached level 100, with their names and clans'],
      ['new',    '[Statistics] Players online right now across the 3 regions, with the number of rooms and a breakdown by server'],
      ['new',    '[Statistics] Highest daily, weekly, ranked and clan scores of all time, with the player or clan that holds each'],
      ['new',    '[Statistics] Most popular guns for daily, weekly and ranked'],
      ['map',    '[Maps] List of maps with their images. Click one for more information'],
      ['weapon', '[Weapons] List of weapons with their images. Click one for more information'],
      ['info',   '[Abilities] List of abilities with their images. Click one for more information'],
      ['tool',   '[Community Vote] Vote and make tier lists for maps, primary, secondary and grenades. Results show as a community tier list or a ranking'],
      ['new',    '[Updates] Update logs for both the game and the tracker'],
      ['tool',   '[Past Hour widget] Sidebar widget for the last hour or the last day (since 00:00 UTC) on the Daily, Weekly, Ranked and Clans boards. Shows total gained, position changes, top gains and the biggest position changes, with a link to the full report'],
      ['tool',   '[Full Report] Detailed report with the whole leaderboard of changes for the hour, day or week. Look back at previous days and weeks'],
      ['tool',   '[Full Report] Strongest clans on the leaderboard, total gained, how many players gained, position changes (up and down), players who entered and left the top list, and the biggest climb and drop'],
      ['tool',   '[Full Report] Table of every player with kills gained, previous position and change (NEW for new entries). Numbers for players outside the top 50 are estimated. A graph of the gains is at the bottom of the page'],
      ['info',   '[Levels] Player levels are estimated from XP, because the exact game formula is not public'],
    ]},
  ],
  game: [
    { version: '2.0', type: 'major', date: '2026-09-28', items: [
      ['info',   '[Poki] Blast Buddies 2.0 was just accepted by Poki'],
      ['weapon', '[Weapons] Weapon attachments'],
      ['weapon', '[Weapons] 2 new guns'],
      ['map',    '[Maps] 2 new maps'],
      ['new',    '[Game] Minimap'],
      ['new',    '[UI] Overhauled UI and HUD, and a better portrait UI'],
      ['new',    '[Gameplay] Better gunplay feel with reload animations and other first-person view improvements'],
      ['new',    '[Visuals] Better effects and new skins'],
      ['new',    '[Battle Pass] Season 3 battle pass'],
    ]},
    { version: '1.4', type: 'minor', items: [
      ['weapon', '[Weapons] Melee weapons'],
      ['weapon', '[Weapons] 1 new gun'],
      ['map',    '[Maps] 2 new maps'],
    ]},
    { version: '1.3', type: 'major', date: '2026-07-21', items: [
      ['new', '[Game modes] 2 new game modes: Hardpoint and Conquest'],
      ['new', '[Ranked] Season 2 of ranked'],
      ['new', '[Battle Pass] New season 2 battle pass'],
      ['new', '[Social] Clans'],
      ['new', '[Social] Friends'],
    ]},
    { version: '1.2', type: 'minor', date: '2026-06-18', items: [
      ['map',    '[Maps] New map'],
      ['weapon', '[Weapons] New secondary weapon'],
    ]},
    { version: '1.1', type: 'major', date: '2026-05-22', items: [
      ['info',   '[Poki] Blast Buddies is live on Poki'],
      ['new',    '[Poki] Poki chat'],
      ['new',    '[Poki] Poki accounts'],
      ['weapon', '[Weapons] 9 new grenades'],
      ['weapon', '[Weapons] 3 new weapons'],
      ['fix',    '[Game] Better anti-cheat'],
      ['fix',    '[Game] Tons of fixes'],
    ]},
  ]
};

// ================= PAGE =================
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => { const t = Date.parse(d + 'T00:00:00Z'); return isNaN(t) ? esc(d) : new Date(t).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); };
document.getElementById('upDiscord').href = CONFIG.discordInvite;

let tab = location.hash === '#game' ? 'game' : 'tracker';
function render() {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const list = UPDATES[tab];
  document.getElementById('upList').innerHTML = list.length ? list.map(u => `
    <article class="up-card">
      <div class="up-top">
        <span class="up-badge ${u.upcoming ? 'soon' : esc(u.type)}">${u.upcoming ? 'COMING SOON' : esc(u.type.toUpperCase())}</span>
        <span class="up-ver">${esc(u.version)}</span>
        ${u.date ? `<span class="up-date">${fmtDate(u.date)}</span>` : u.upcoming ? '<span class="up-date">Date TBA</span>' : ''}
      </div>
      <ul class="up-list">${u.items.map(([k, t]) => `<li><span><span class="up-ic">${KIND[k] || KIND.info}</span> ${esc(t)}</span></li>`).join('')}</ul>
    </article>`).join('') : '<p class="up-empty">No updates posted here yet.</p>';
}
document.querySelector('.up-tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; history.replaceState(null, '', '#' + tab); render();
});
render();
</script>
</body>
</html>
