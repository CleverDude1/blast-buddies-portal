<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players | Blast Buddies Tracker</title>
<link rel="icon" href="images/icons/home.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ---- player database ---- */
.pl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;max-width:1400px;margin:0 auto 18px}
.pl-stat{background:rgba(15,20,11,.94);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.pl-stat b{display:block;font-size:28px;font-weight:800}
.pl-stat span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;max-width:1400px;margin:0 auto 14px}
.pl-tools .search{flex:1;min-width:220px;height:52px;font-size:16px}
.pl-check{display:flex;align-items:center;gap:8px;color:#d9dccf;font-weight:600;cursor:pointer}
.pl-row{display:grid;grid-template-columns:60px minmax(150px,1.6fr) minmax(150px,1.2fr) 64px 110px 110px 110px 56px;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.pl-row:not(.pl-head):hover{background:rgba(255,255,255,.03)}
.pl-head{font-weight:700;color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid #3a4630}
.pl-head button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;text-align:left;padding:0}
.pl-head button.on{color:var(--gold)}
.pl-row .n{color:var(--muted);font-weight:700;text-align:center}
.pl-row .pname{cursor:pointer}
.pl-row .when{color:#cfd3c4;font-size:14px}
.pl-pager{display:flex;gap:12px;align-items:center;justify-content:center;margin:18px auto;color:var(--muted)}
.pl-hist{display:grid;gap:6px;margin-top:10px;max-height:240px;overflow:auto}
.pl-hist div{display:flex;justify-content:space-between;gap:10px;background:var(--card2);border-radius:10px;padding:8px 12px;font-size:14px}
.pl-hist span{color:var(--muted);white-space:nowrap}
</style>
</head>
<body data-page="players">
<template id="page-content">
<section class="panel">
  <h1 class="page-title">Players</h1>
  <p class="muted">Every player the tracker has ever seen in the top 50 of the daily, weekly or ranked leaderboard. Once a player is here, they stay here, and their latest name, clan and XP keep updating.</p>
</section>
<div class="pl-stats" id="plStats"></div>
<div class="pl-tools">
  <input class="search" id="q" placeholder="Search by name, clan or player ID" autocomplete="off">
  <label class="pl-check"><input type="checkbox" id="only100"> Level 100 only</label>
</div>
<div class="status" id="status">Loading...</div>
<div class="board"><div class="board-inner">
  <div class="pl-row pl-head" id="plHead"></div>
  <div id="rows"></div>
</div></div>
<div class="pl-pager" id="plPager"></div>

<dialog id="dlg"><button class="pill dlg-close" id="dlgClose">Close</button><div id="dlgBody"></div></dialog>
</template>
<script src="js/layout.js"></script>
<script src="js/clan-colors.js"></script>
<script src="js/level.js"></script>
<script src="js/players.js"></script>
</body>
</html>
