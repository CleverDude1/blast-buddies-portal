<title>Vehicles</title>
<style>
:root{--bg:#e9e7da;--fg:#1c2014;--card:#f6f5ec;--mut:#6a6f58;--ln:#cfcdb8;--acc:#646c40;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14160e;--fg:#e8e7d6;--card:#1d2014;--mut:#9a9f86;--ln:#33372a;--acc:#9aa66a}}
:root[data-theme="dark"]{--bg:#14160e;--fg:#e8e7d6;--card:#1d2014;--mut:#9a9f86;--ln:#33372a;--acc:#9aa66a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Trebuchet MS",Verdana,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 34px/1 Georgia,serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.view{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:10px;height:460px;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.tools{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
button{font:inherit;padding:6px 12px;border:1px solid var(--ln);background:var(--card);color:var(--fg);border-radius:6px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc)}
button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:2px 16px 12px}
h2{font:700 16px Georgia,serif;margin:14px 0 4px;color:var(--acc)}
.r{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dotted var(--ln)}
.r span:first-child{color:var(--mut)}.r span:last-child{font-weight:700;text-align:right}
.note{color:var(--mut);font-size:13px;margin-top:14px}

<p class="note">Colours and a few small parts are estimated, because some helper functions and palette constants were not in the pasted code.</p>

cv.addEventListener("pointermove",e=>{if(!drag)return;th-=(e.clientX-drag[0])*.01;ph=Math.max(.2,Math.min(1.5,ph-(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY]});

cv.addEventListener("wheel",e=>{e.preventDefault();rad=Math.max(5,Math.min(34,rad+e.deltaY*.01))},{passive:false});
const bs=document.getElementById("bs"),bw=document.getElementById("bw");
bs.onclick=()=>{spin=!spin;bs.setAttribute("aria-pressed",spin)};
bw.onclick=()=>{wire=!wire;bw.setAttribute("aria-pressed",wire);Object.values(mats).forEach(m=>m.wireframe=wire)};
show("BUGGY");
(function loop(){if(spin&&!drag)th+=.006;spinners.forEach(s=>s.rotation.y+=.25);cam.position.set(rad*Math.sin(ph)*Math.sin(th),rad*Math.cos(ph)+view[1],rad*Math.sin(ph)*Math.cos(th));cam.lookAt(0,view[1],0);R.render(scene,cam);requestAnimationFrame(loop)})();
</script></body></html>
