<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Activity | Blast Buddies Tracker</title>
<link rel="icon" href="images/icons/home.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
/* ---- player activity ---- */
.pa-wrap{max-width:1400px;margin:0 auto}
.pa-controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.pa-controls .seg{margin:0}
.pa-tile .pa-t{font-size:18px;font-weight:700}
.pa-tile .pa-s{font-size:14px;color:var(--muted);margin-bottom:4px}
.pa-tile .map-val{font-size:30px;line-height:1.15}
.pa-tile.hot{border-color:#6a5a1f;background:rgba(242,183,53,.07)}
.pa-ok{color:#6fdc7a}.pa-gold{color:var(--gold)}.pa-bad{color:#ff6b6b}
.pa-card{background:rgba(15,20,11,.94);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:24px}
.pa-card h3{font-size:20px;margin-bottom:4px}
.pa-card .muted{font-size:14px}
.pa-bars{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;height:210px;margin-top:16px;align-items:end}
.pa-col{height:100%;display:flex;align-items:flex-end;border-radius:6px 6px 0 0;cursor:default}
.pa-col i{display:block;width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#6fdc7a,#2f8f3f)}
.pa-col.peak i{background:linear-gradient(180deg,#ffd24d,#d9921f)}
.pa-col.now{outline:2px solid #fff;outline-offset:1px}
.pa-col:hover{background:rgba(255,255,255,.06)}
.pa-labels{display:grid;grid-template-columns:repeat(24,1fr);gap:4px;margin-top:6px;font-size:11px;color:var(--muted);text-align:center}
.pa-key{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:10px;color:var(--muted)}
.pa-key span{display:flex;align-items:center;gap:6px}
.pa-key i{display:inline-block;width:12px;height:12px;border-radius:3px}
.pa-days{display:grid;gap:8px;margin-top:14px}
.pa-day{display:grid;grid-template-columns:110px 1fr 80px;gap:12px;align-items:center;font-size:14px}
.pa-day .tr{height:12px;border-radius:6px;background:#050704;overflow:hidden}
.pa-day .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2f8f3f,#6fdc7a)}
.pa-day.top .tr i{background:linear-gradient(90deg,#d9921f,#ffd24d)}
.pa-day b{text-align:right}
.pa-heat{display:grid;grid-template-columns:92px repeat(24,minmax(0,1fr));gap:3px;margin-top:14px;overflow-x:auto}
.pa-heat .hd{font-size:11px;color:var(--muted);text-align:center}
.pa-heat .rl{font-size:13px;color:#d9dccf;display:flex;align-items:center}
.pa-heat .c{height:26px;border-radius:5px;min-width:16px}
.pa-heat .c.best{outline:2px solid #fff;outline-offset:-1px}
.pa-reg{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.pa-reg th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.pa-reg td{padding:10px;border-bottom:1px solid #1e2618}
.pa-reg .sh{display:flex;align-items:center;gap:8px}.pa-reg .sh i{display:block;height:8px;border-radius:4px;background:#5aa9ff}
.pa-note{color:var(--muted);font-size:13px;margin-top:18px;line-height:1.6}
.pa-empty{padding:48px 0;text-align:center;color:var(--muted)}
@media(max-width:700px){.pa-day{grid-template-columns:84px 1fr 64px}.pa-card{padding:16px}}
</style>
</head>
<body data-page="activity">
<template id="page-content">
<section class="panel">
  <h1 class="page-title">Player Activity</h1>
  <p class="muted">When the game is busiest. Built from hourly snapshots of the players online across North America, Europe and Asia, so the longer the site collects data, the more accurate it gets.</p>
</section>
<div class="pa-wrap" id="paApp"><p class="pa-empty">Loading...</p></div>
</template>
<script src="js/layout.js"></script>
<script src="js/player-activity.js"></script>
</body>
</html>player-activi
